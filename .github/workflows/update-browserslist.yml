name: Update Transitive dependencies and Browserslist Database

on:
  schedule:
    # Runs every Fri at 01:18 AM UTC
    - cron: "18 1 * * 5"
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps-and-browserslist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true

      - name: Update transitive dependencies in the `package-lock.json`
        working-directory: ./ui
        run: npm run upd-trans-deps

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci

      - name: Update browserslist database
        working-directory: ./ui
        run: npx --yes update-browserslist-db@latest

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: ${{ steps.changes.outputs.changes == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.COMMENT_TOKEN }}
          commit-message: "Bump transitive deps and browserslist database"
          title: "Bump transitive deps and browserslist database"
          branch: update-deps-and-browserslist-db
          delete-branch: true
          labels: "dependencies, javascript"
          body: |
            This PR updates the transitive dependencies and browserslist database to the latest versions.

            Changes:
            - Updated transitive dependencies in package-lock.json
            - Updated caniuse-lite to latest version
            - Refreshed browser compatibility data

            This is an automated update similar to Dependabot PRs.
